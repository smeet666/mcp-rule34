# Nightly canary against the real rule34.xxx API.
#
# The unit tests read invented XML, so they cannot detect that the site renamed
# an attribute or changed a status code: the day it does, they stay green while
# the published server is broken for everyone. This job is the only thing that
# notices, and it opens an issue when it fails.
#
# It is deliberately separate from CI: it depends on a third-party service, so a
# failure here means "the API moved", never "this pull request is bad".

name: Live canary

on:
  schedule:
    # 04:42 UTC, offset from the sibling project so the two do not run together.
    - cron: "42 4 * * *"
  workflow_dispatch:

# A single run at a time, so a slow night cannot overlap with the next one.
concurrency:
  group: live-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to open the issue that reports a broken contract.
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run the live canary
        env:
          # The live suite skips itself without these, so a canary missing them
          # would pass every night while testing nothing.
          RULE34_USER_ID: ${{ secrets.RULE34_USER_ID }}
          RULE34_API_KEY: ${{ secrets.RULE34_API_KEY }}
          RULE34_LIVE: "1"
          # Slower than the default: a scheduled job has no user waiting, and the
          # site limits its rate without publishing one.
          RULE34_MIN_INTERVAL_MS: "2000"
          # Generous: a canary must fail on a changed contract, not on a slow night.
          RULE34_TIMEOUT_MS: "60000"
          RULE34_LOG_LEVEL: info
        run: npm run test:live

      - name: Report a broken canary
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Live canary failing: the rule34.xxx API may have changed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The nightly live canary failed. Either rule34.xxx changed the API this server reads,",
              "it refused the credentials, or it was unreachable from the runner.",
              "",
              `Run: ${runUrl}`,
              "",
              "The assertion messages name the attribute or behaviour that moved. Fixing one means",
              "editing the parser under `src/rule34/parsers/`, adding the real shape to the unit",
              "tests, and releasing a patch version.",
              "",
              "Two assertions deserve special attention. The canary checks that a narrowed search",
              "still counts fewer posts than the search it narrows, which is what proves the site",
              "does the filtering rather than this server claiming to. And it checks that an unknown",
              "tag still answers under its own root element, which is what tells a misspelled tag",
              "apart from a combination the site holds nothing for.",
            ].join("\n");

            // Reuse the open issue rather than filing one every night.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-canary",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString()}. ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-canary"],
              });
            }
